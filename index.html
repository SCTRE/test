<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>劣币驱逐良币 · VIBE 知识大赏</title>
<style>
:root{
  --bg:#07070b;
  --fg:#f9f7f2;
  --sub:#969288;
  --gold:#f5cb7d;
  --gold-glow:rgba(245,203,125,0.4);
  --bad:#6ea897;
  box-sizing:border-box;
}
html,body{
  height:100%;margin:0;background:#000;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* 16:9 响应式超清舞台容器 */
#st{
  position:relative;
  container-type:size;
  width:min(100vw,100vh*16/9);
  aspect-ratio:16/9;
  background:radial-gradient(circle at 50% 40%,#131422 0%,var(--bg) 78%);
  color:var(--fg);
  overflow:hidden;
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
  user-select:none;
  box-shadow:0 0 70px rgba(0,0,0,0.95);
}

canvas{position:absolute;inset:0;width:100%;height:100%}
#sc{position:absolute;inset:0}

/* 左上角精微角标（尺寸极小、紧贴左上、首屏隐藏） */
.brand-corner{
  position:absolute;
  top:1.2cqw;
  left:2.2cqw;
  display:flex;
  align-items:center;
  gap:.45cqw;
  font:500 .82cqw system-ui,sans-serif;
  letter-spacing:.2cqw;
  color:rgba(249,247,242,.32);
  z-index:15;
  opacity:0;
  transition:opacity .4s ease;
  pointer-events:none;
}
.brand-corner .dot{
  width:.32cqw;
  height:.32cqw;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 .6cqw var(--gold);
}

/* 场景结构布局 */
.scene{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  padding:3.6cqw 5cqw 3.2cqw;
  perspective:1000px;
}

/* ---------------- 专属转场动效（严格串行：旧页完全消失后新页才启动） ---------------- */
.fx-zoom-in{animation:trZoomIn .65s cubic-bezier(.16,1,.3,1) forwards}
.fx-zoom-out{animation:trZoomOut .45s cubic-bezier(.7,0,.84,0) forwards}
@keyframes trZoomIn{from{opacity:0;transform:scale(1.12);filter:blur(1.5cqw)}to{opacity:1;transform:scale(1);filter:none}}
@keyframes trZoomOut{to{opacity:0;transform:scale(.92);filter:blur(1.5cqw)}}

.fx-slideL-in{animation:trSlideLIn .65s cubic-bezier(.16,1,.3,1) forwards}
.fx-slideL-out{animation:trSlideLOut .45s cubic-bezier(.7,0,.84,0) forwards}
@keyframes trSlideLIn{from{opacity:0;transform:translateX(5cqw);filter:blur(1cqw)}to{opacity:1;transform:none;filter:none}}
@keyframes trSlideLOut{to{opacity:0;transform:translateX(-5cqw);filter:blur(1cqw)}}

.fx-slideR-in{animation:trSlideRIn .65s cubic-bezier(.16,1,.3,1) forwards}
.fx-slideR-out{animation:trSlideROut .45s cubic-bezier(.7,0,.84,0) forwards}
@keyframes trSlideRIn{from{opacity:0;transform:translateX(-5cqw);filter:blur(1cqw)}to{opacity:1;transform:none;filter:none}}
@keyframes trSlideROut{to{opacity:0;transform:translateX(5cqw);filter:blur(1cqw)}}

.fx-flip-in{animation:trFlipIn .7s cubic-bezier(.16,1,.3,1) forwards}
.fx-flip-out{animation:trFlipOut .45s cubic-bezier(.7,0,.84,0) forwards}
@keyframes trFlipIn{from{opacity:0;transform:rotateX(18deg) translateY(3cqw);filter:blur(1cqw)}to{opacity:1;transform:none;filter:none}}
@keyframes trFlipOut{to{opacity:0;transform:rotateX(-15deg) translateY(-2cqw);filter:blur(1cqw)}}

.fx-blur-in{animation:trBlurIn .75s cubic-bezier(.16,1,.3,1) forwards}
.fx-blur-out{animation:trBlurOut .45s cubic-bezier(.7,0,.84,0) forwards}
@keyframes trBlurIn{from{opacity:0;filter:blur(2.2cqw);transform:scale(.97)}to{opacity:1;filter:none;transform:scale(1)}}
@keyframes trBlurOut{to{opacity:0;filter:blur(2cqw);transform:scale(1.03)}}

/* ---------------- 居中聚焦后上浮的主题排版 ---------------- */
.hd{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  z-index:10;
  will-change:transform,opacity;
  animation:themeFloating 2.1s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes themeFloating{
  0%{opacity:0;filter:blur(1.5cqw);transform:translateY(19cqw) scale(1.1)}
  20%{opacity:1;filter:blur(0);transform:translateY(19cqw) scale(1.1)}
  62%{opacity:1;filter:blur(0);transform:translateY(19cqw) scale(1.1)}
  100%{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}
}

.k{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:.3cqw 1.2cqw;
  border-radius:99cqw;
  background:rgba(245,203,125,.08);
  border:1px solid rgba(245,203,125,.3);
  font:600 1.15cqw system-ui,sans-serif;
  letter-spacing:.35cqw;
  color:var(--gold);
  margin-bottom:.6cqw;
}
.h{
  font-size:3.5cqw;
  font-weight:700;
  line-height:1.25;
  margin:0;
  letter-spacing:.05cqw;
}
.h b{
  color:var(--gold);
  text-shadow:0 0 1.8cqw var(--gold-glow);
  font-weight:inherit;
}

/* ---------------- 居中且放大的动画展示舞台 ---------------- */
.vis-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:translateY(2cqw) scale(.96);
  animation:visShow 0.9s cubic-bezier(.16,1,.3,1) 1.55s forwards;
}
@keyframes visShow{
  to{opacity:1;filter:none;transform:translateY(0) scale(1)}
}
.vis{
  height:32.5cqw;
  aspect-ratio:880/480;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:1.5cqw;
  background:linear-gradient(165deg,rgba(255,255,255,0.06),rgba(255,255,255,0.015));
  padding:.6cqw 1.2cqw;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2cqw 4.5cqw rgba(0,0,0,0.55);
  backdrop-filter:blur(14px);
}
.vis svg{width:100%;height:100%;display:block;overflow:visible}

/* ---------------- 底部清晰醒目的金句排版 ---------------- */
.ft{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:translateY(1.5cqw);
  animation:ftShow .8s cubic-bezier(.16,1,.3,1) 2.4s forwards;
}
@keyframes ftShow{to{opacity:1;transform:translateY(0)}}
.p{
  font:600 2.5cqw/1.35 system-ui,"PingFang SC","Noto Sans SC",sans-serif;
  color:#f2ede4;
  margin:0;
  white-space:nowrap;
  text-align:center;
  letter-spacing:.04cqw;
  max-width:92cqw;
}
.p b{color:var(--gold);font-weight:700;text-shadow:0 0 1.4cqw var(--gold-glow)}
.p .sep{display:inline-block;margin:0 1.1cqw;opacity:.35;font-weight:300}

/* 顶部进度条 */
#bar{
  position:absolute;top:0;left:0;height:.35cqw;
  background:linear-gradient(90deg,transparent,var(--gold));
  width:0;z-index:20;
}

/* SVG通用样式与延时动效规范 */
.t{fill:var(--fg)}.tg{fill:var(--gold)}.tb{fill:var(--bad)}.tm{fill:var(--sub)}
svg text{font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif}
.ln{stroke:rgba(255,255,255,0.22);stroke-width:2.2;fill:none}
.dw{stroke-dasharray:var(--L,900);stroke-dashoffset:var(--L,900);animation:dr 1.3s ease var(--d,1.6s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fo .8s ease var(--d,1.6s) forwards}
@keyframes fo{to{opacity:1}}
.po{opacity:0;transform-box:fill-box;transform-origin:center;animation:pp .6s cubic-bezier(.2,1.4,.4,1) var(--d,1.6s) forwards}
@keyframes pp{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:gr 1.1s cubic-bezier(.2,.8,.2,1) var(--d,1.6s) forwards}
@keyframes gr{to{transform:none}}
.rg{fill:none;stroke:rgba(245,203,125,0.4);stroke-width:2.2;transform-box:fill-box;transform-origin:center;animation:pul 3s ease-out var(--d,1.6s) infinite}
@keyframes pul{from{transform:scale(.5);opacity:1}to{transform:scale(3.2);opacity:0}}
.orb{transform-origin:440px 240px;animation:rot 9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.dt{fill:#8a878055;animation:wv 2.4s ease-in-out var(--d) infinite}
@keyframes wv{50%{fill:#f5cb7dbb}}
.gdot{fill:var(--gold);animation:gp 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gp{50%{transform:scale(1.5);opacity:.6}}
.mv{opacity:0;animation:mvx var(--t) linear var(--d) infinite}
@keyframes mvx{0%{transform:translate(var(--x1),var(--y1)) scale(var(--s));opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(var(--x2),var(--y2)) scale(var(--s));opacity:0}}
.cgd{fill:url(#gd)}.cbd{fill:url(#bd)}
.gone{animation:gn .4s ease 3.8s forwards}
@keyframes gn{to{opacity:0}}
.spin{animation:sp 2.4s ease-in-out infinite alternate}
@keyframes sp{from{transform:scaleX(1)}to{transform:scaleX(-1)}}

/* 封面启动层 */
#ov{
  position:absolute;inset:0;z-index:99;
  background:#07070bee;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.8cqw;cursor:pointer;
  backdrop-filter:blur(22px);
}
#ov i{font:normal 1.35cqw system-ui,sans-serif;color:var(--sub);letter-spacing:.45cqw}
#ov b{font-size:6.4cqw;letter-spacing:.65cqw;color:var(--fg)}
#ov b span{color:var(--gold)}
</style>
</head>
<body>
<!-- 背景音乐：移除 loop，支持单次播放与重播重置 -->
<audio id="bgm" src="https://sf11-cdn-tos.douyinstatic.com/obj/ies-music/7691038352723725075.mp3" preload="auto"></audio>

<svg width="0" height="0" style="position:absolute"><defs>
<radialGradient id="gd" cx=".35" cy=".3"><stop offset="0" stop-color="#fff4d0"/><stop offset=".45" stop-color="#f5cb7d"/><stop offset="1" stop-color="#a67b2d"/></radialGradient>
<radialGradient id="bd" cx=".35" cy=".3"><stop offset="0" stop-color="#c6ded4"/><stop offset=".5" stop-color="#6ea897"/><stop offset="1" stop-color="#3c574f"/></radialGradient>
</defs></svg>

<div id="st">
  <canvas id="cv"></canvas>
  <div class="brand-corner" id="brand-corner">
    <span class="dot"></span>
    <span>VIBE 知识大赏 · 劣币驱逐良币</span>
  </div>
  <div id="sc"></div>
  <div id="bar"></div>
  <div id="ov">
    <i>VIBE 知识大赏</i>
    <b>劣币<span>驱逐</span>良币</b>
    <i>▶ 点击启幕（已配高沉浸音效 · 方向键可随意切页）</i>
  </div>
</div>

<script>
const d=x=>`style="--d:${(Number(x)+1.55).toFixed(2)}s"`,J=a=>a.join('');
const coin=(c,t='')=>`<circle r="36" class="${c}"/><circle r="27" fill="none" stroke="#07070b55" stroke-width="2.5"/><text y="10" text-anchor="middle" font-size="28" fill="#07070b" font-weight="700">${t}</text>`;
const mv=(c,x1,y1,x2,y2,dl,t,s=.85)=>`<g class="mv" style="--x1:${x1}px;--y1:${y1}px;--x2:${x2}px;--y2:${y2}px;--d:${(Number(dl)+1.55).toFixed(2)}s;--t:${t}s;--s:${s}">${coin(c)}</g>`;

// 全新居中双胶囊对齐架构：左列中心 X:240，右列中心 X:640，标题与下方卡片100%同轴对齐
const rows=(a,f=26,pre='',y0=110,gap=86)=>J(a.map((r,i)=>{
  const y=y0+i*gap;
  const dl=.3+i*.7;
  return `
    <g class="fi" ${d(dl)}>
      <rect x="130" y="${y-38}" width="220" height="52" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="240" y="${y-2}" text-anchor="middle" font-size="${f}" font-weight="600" class="${r[2]}">${r[0]}</text>
    </g>
    <path d="M375 ${y-12}H485" class="dw ln" style="--L:110;--d:${(dl+1.55).toFixed(2)}s"/>
    <polygon points="495,${y-12} 483,${y-18} 483,${y-6}" fill="rgba(245,203,125,0.7)"/>
    <g class="fi" ${d(dl+.6)}>
      <rect x="530" y="${y-38}" width="220" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
      <text x="640" y="${y-2}" text-anchor="middle" font-size="${f}" font-weight="500" class="${r[3]}">${pre}${r[1]}</text>
    </g>
  `;
}));

const sv=x=>`<svg viewBox="0 0 880 480">${x}</svg>`;

// 13 幕全新超清、文字放大、严格居中、曲线零穿透的矢量动画组件
const V=[
// 0. 核心困惑
sv(J([0,1,2].map(i=>`<circle cx="440" cy="240" r="85" class="rg" ${d(i)}/>`))+`<g class="orb"><g transform="translate(640 240) scale(1.25)">${coin('cgd')}</g><g transform="translate(240 240) scale(1.25)">${coin('cbd')}</g></g><text x="440" y="280" text-anchor="middle" font-size="115" class="tg">?</text>`),

// 1. 认知纠偏（8x5 矩阵点位居中：X从160至720）
sv(J(Array.from({length:40},(_,i)=>{const x=160+i%8*80,y=75+Math.floor(i/8)*70;return i==19?`<circle cx="${x}" cy="${y}" r="20" class="gdot"/>`:`<circle cx="${x}" cy="${y}" r="14" class="dt" ${d((i%8)*.15+Math.floor(i/8)*.08)}/>`}))+`<text x="440" y="445" text-anchor="middle" font-size="30" font-weight="600" class="tg fi" ${d(1.8)}>金色的 TA：始终稳定，但在快节奏下不易被察觉</text>`),

// 2. 底层规律（历史轴线三节点严格以 440 为中心对称）
sv(`<path d="M90 240H790" class="dw" style="--L:700;stroke:#f5cb7d;stroke-width:3.5;--d:1.6s"/>`+J([[180,'前5世纪','古希腊喜剧','已有类似记载'],[440,'16世纪','托马斯·格雷欣','观察提出假说'],[700,'19世纪','正式命名为','格雷欣法则']].map((n,i)=>`<circle cx="${n[0]}" cy="240" r="11" fill="#f5cb7d" class="po" ${d(.8+i*1.2)}/><text x="${n[0]}" y="165" text-anchor="middle" font-size="35" class="tg fi" ${d(.8+i*1.2)}>${n[1]}</text><text x="${n[0]}" y="315" text-anchor="middle" font-size="28" class="t fi" ${d(1+i*1.2)}>${n[2]}</text><text x="${n[0]}" y="355" text-anchor="middle" font-size="25" class="tm fi" ${d(1.2+i*1.2)}>${n[3]}</text>`))+mv('cgd',180,240,700,240,.3,4.5,.6)),

// 3. 运作机制（抽屉珍藏 vs 市场流通）
sv(`<rect x="70" y="75" width="180" height="130" rx="16" class="ln" stroke-dasharray="8 8" style="stroke:#f5cb7d99"/><text x="160" y="240" text-anchor="middle" font-size="26" class="tm">抽屉珍藏</text><text x="490" y="70" text-anchor="middle" font-size="32" class="tg">良币（足金）· 被民间收藏</text><text x="440" y="440" text-anchor="middle" font-size="32" class="tb">劣币（掺铜）· 充斥流通市场</text>`+J([0,1,2].map(i=>mv('cgd',760,140,160,140,i*1.3,3.8,.9)))+J([0,1,2,3,4].map(i=>mv('cbd',-40,360,920,360,i*.6,3.2,.9)))),

// 4. 成立前提（双币天平对称居中，字体全面放大）
sv(`<g transform="translate(250 230) scale(2)">${coin('cgd','¥1')}</g><g transform="translate(630 230) scale(2)">${coin('cbd','¥1')}</g><text x="440" y="65" text-anchor="middle" font-size="32" class="tm fi" ${d(.3)}>市场当下：只认表面面值</text><path d="M250 95H630" class="dw ln" style="--L:380;--d:1.7s"/><text x="440" y="265" text-anchor="middle" font-size="95" class="t gone">=</text><text x="440" y="265" text-anchor="middle" font-size="95" class="tg fi" ${d(2.6)}>≠</text><text x="250" y="390" text-anchor="middle" font-size="32" class="tg fi" ${d(2.8)}>足金成色</text><text x="630" y="390" text-anchor="middle" font-size="32" class="tb fi" ${d(2.8)}>掺铜成色</text>`),

// 5. 映射恋爱（胶囊对比表：对称居中对齐）
sv(rows([['良币','真诚 · 坚守底线','tg','t'],['劣币','套路 · 暧昧拉扯','tb','t'],['面值','随口承诺的喜欢','t','tm'],['成色','长期行动与代价','t','tg']],26,'',75,76)),

// 6. 成本博弈（柱状图与图例居中对称）
sv(`<rect x="290" y="30" width="22" height="22" rx="4" fill="#6ea897"/><text x="325" y="49" font-size="25" class="tb">套路手段</text><rect x="480" y="30" width="22" height="22" rx="4" fill="#f5cb7d"/><text x="515" y="49" font-size="25" class="tg">真实付出</text><path d="M90 400H790" class="ln"/>`+J([['投入成本',20,85],['见效速度',90,30],['长期抗风险',25,90]].map((r,i)=>{const x=145+i*225;return `<rect x="${x}" y="${400-r[1]*3.2}" width="70" height="${r[1]*3.2}" rx="6" class="bar" style="fill:#6ea897;--d:${(1.6+i*1).toFixed(2)}s"/><rect x="${x+85}" y="${400-r[2]*3.2}" width="70" height="${r[2]*3.2}" rx="6" class="bar" style="fill:#f5cb7d;--d:${(1.9+i*1).toFixed(2)}s"/><text x="${x+77}" y="445" text-anchor="middle" font-size="28" class="t fi" ${d(.4+i*1)}>${r[0]}</text>`}))),

// 7. 筛选机制（折线图右侧标注加粗右对齐，严防遮挡截断）
sv(`<path d="M100 400H760M100 400V70" class="ln"/><path d="M140 170L300 135L460 115L610 110" class="dw" style="--L:500;stroke:#6ea897;stroke-width:5.5;fill:none;--d:1.6s"/><path d="M140 220L300 270L460 300L610 320" class="dw" style="--L:500;stroke:#f5cb7d;stroke-width:5.5;fill:none;--d:1.9s"/>`+J(['初始吸引','聊天推拉','暧昧博弈','谁先投入'].map((t,i)=>`<text x="${140+i*157}" y="445" text-anchor="middle" font-size="26" class="tm">${t}</text>`))+`<text x="790" y="118" text-anchor="end" font-size="27" font-weight="700" class="tb fi" ${d(1.8)}>劣币通关率 ↗</text><text x="790" y="328" text-anchor="end" font-size="27" font-weight="700" class="tg fi" ${d(1.8)}>良币通关率 ↘</text>`),

// 8. 信号差异（曲线与坐标大字完全隔离，零文字穿透）
sv(`<path d="M80 400H800" class="ln"/>`+
`<path d="M80 398C150 140 210 130 260 130C340 130 380 385 450 395H800" class="dw" style="--L:1100;stroke:#6ea897;stroke-width:5.5;fill:none;--d:1.6s"/>`+
`<path d="M80 398C320 398 480 360 600 240C670 170 720 135 770 130" class="dw" style="--L:1100;stroke:#f5cb7d;stroke-width:5.5;fill:none;--d:2.2s"/>`+
`<text x="240" y="65" text-anchor="middle" font-size="28" font-weight="600" class="tb fi" ${d(1.4)}>心动（快信号 · 骤升骤降）</text>`+
`<text x="600" y="65" text-anchor="middle" font-size="28" font-weight="600" class="tg fi" ${d(2.4)}>可靠（慢信号 · 随时间成形）</text>`+
`<text x="800" y="440" text-anchor="end" font-size="24" class="tm">时间跨度 →</text><circle cx="770" cy="130" r="11" class="gdot"/>`),

// 9. 标签逆转（表头「快餐规则常说」X:240 与「本质其实是」X:640 百分百同轴居中对齐）
sv(`<text x="240" y="75" text-anchor="middle" font-size="26" class="tm">快餐规则常说</text><text x="640" y="75" text-anchor="middle" font-size="26" class="tm">本质其实是</text>`+rows([['反应慢','踏实且不轻浮','tb','tg'],['很无聊','不制造情绪内耗','tb','tg'],['没感觉','提供健康的情绪稳定','tb','tg']],26,'',145,95)),

// 10. 良币归宿（双圈流动模型：居中平衡）
sv(`<circle cx="270" cy="240" r="170" class="ln" stroke-dasharray="7 9" style="stroke:#6ea89799"/><circle cx="630" cy="240" r="120" class="ln" style="stroke:#f5cb7d99"/><text x="270" y="45" text-anchor="middle" font-size="29" class="tb">公开流动池 · 高流失</text><text x="630" y="90" text-anchor="middle" font-size="29" class="tg">深度信任圈 · 终身留存</text>`+mv('cbd',130,170,390,320,0,4.5,.65)+mv('cbd',370,140,160,340,1.2,4.5,.65)+mv('cbd',150,300,390,190,2.4,4.5,.65)+mv('cbd',270,100,270,390,3.2,4.5,.65)+J([0,1,2].map(i=>mv('cgd',310,240,630,240,i*1.3,4,.65)))),

sv(`<text x="440" y="65" text-anchor="middle" font-size="32" class="tg fi">验币三问模型</text>`+rows([['一致性','言行是否长期合一','tg','t'],['时间跨度','将周期拉长至一年','tg','t'],['付出代价','肯为关系承担成本','tg','t']],25,'✓ ',145,95)),

// 12. 终局结语
sv(`<circle cx="440" cy="240" r="225" class="ln" style="stroke:#f5cb7d33"/><circle cx="440" cy="240" r="190" class="rg" ${d(0)}/><g transform="translate(440 240)"><g class="spin"><g transform="scale(4.2)">${coin('cgd','良')}</g></g></g>`)

// 数据配置：每页核心文案与专属转场
const S=[
  ['核心困惑','为什么 <b>三观越正</b> 的人，反而 <b>越难谈恋爱</b>？','你<b>真诚且有底线</b>，却被当下的快餐游戏逆向淘汰',0,['fx-zoom-in','fx-zoom-out']],
  ['认知纠偏','别否定自己：这不是 <b>“你不够好”</b> 的问题','真实的成色需要<b>时间沉淀</b><span class="sep">/</span>而浮躁的开局<b>只奖赏刺激</b>',1,['fx-slideL-in','fx-slideL-out']],
  ['底层规律','格雷欣法则：经济学里的 <b>劣币驱逐良币</b>','当不同成色的货币面值相同：<b>良币被私藏，劣币满街狂奔</b>',2,['fx-flip-in','fx-flip-out']],
  ['运作机制','为什么高品质的良币，会 <b>彻底退出流通</b>？','人人都想<b>花掉廉价劣币</b><span class="sep">/</span>久而久之市场<b>只剩下了劣币</b>',3,['fx-blur-in','fx-blur-out']],
  ['成立前提','劣币能大行其道，在于 <b>两大信息盲区</b>','<b>表面面值相同</b><span class="sep">｜</span>当下<b>无法验明真实成色</b>',4,['fx-slideR-in','fx-slideR-out']],
  ['映射恋爱','把“货币交易”换成 <b>“两性关系”</b>','<b>面值</b>是张口就来的喜欢<span class="sep">｜</span><b>成色</b>是需要代价的担当',5,['fx-zoom-in','fx-zoom-out']],
  ['成本博弈','<b>套路极其廉价</b>，而 <b>真诚成本高昂</b>','劣币能<b>批量试错与抽身</b><span class="sep">/</span>良币却在<b>全额质押自己的信誉</b>',6,['fx-slideL-in','fx-slideL-out']],
  ['筛选机制','快餐式的关卡，正在 <b>精准过滤掉良币</b>','前期只奖励<b>推拉与即时刺激</b><span class="sep">/</span>守底线的人开局便被筛除',7,['fx-flip-in','fx-flip-out']],
  ['信号差异','心动是 <b>快信号</b>，可靠是 <b>慢信号</b>','心动<b>来得快衰减更快</b><span class="sep">/</span>能支撑一生的，永远是<b>慢热的可靠</b>',8,['fx-blur-in','fx-blur-out']],
  ['标签逆转','你的<b>优秀特质</b>，在浅薄语境下被 <b>倒置解读</b>','克制被当成<b>无趣</b><span class="sep">/</span>别因快市场的误读，而怀疑自己的成色',9,['fx-slideR-in','fx-slideR-out']],
  ['良币归宿','良币从未消失，只是 <b>主动退出了公域池</b>','靠谱的人退出了快餐匹配，悄悄聚合在<b>深度信任圈</b>中',10,['fx-zoom-in','fx-zoom-out']],
  ['破局法则','如何打破死局？掌握 <b>“验币三问”</b>','<b>言行是否一致</b><span class="sep">｜</span><b>拉长时间周期</b><span class="sep">｜</span><b>是否愿意承担代价</b>',11,['fx-slideL-in','fx-slideL-out']],
  ['终局结语','永远别变成 <b>劣币</b>，也永远别放弃做 <b>足金良币</b>','让自己的成色<b>清晰可见</b><span class="sep">/</span>也修炼一双<b>识破套路的慧眼</b>',12,['fx-flip-in','fx-flip-out']]
];

const sc=document.getElementById('sc'),bar=document.getElementById('bar'),ov=document.getElementById('ov'),bgm=document.getElementById('bgm'),brandCorner=document.getElementById('brand-corner');
const N=S.length, SWITCH_DELAY=450;
let tm=null,cur=0,isSwitching=false;

// 动态平均分配时长：严格依 BGM 实际音轨长度精密计算，使音频与视频画面同步结束
function getSceneDuration(){
  if(bgm.duration && isFinite(bgm.duration) && bgm.duration > 20){
    const totalMs = bgm.duration * 1000;
    return Math.floor((totalMs - (N - 1) * SWITCH_DELAY) / N);
  }
  return 8500; // 音频元数据未就绪时的稳健回退基准
}

// 挂载新场景（确保上一页已彻底销毁）
function renderScene(i){
  cur=i;
  const [k,h,p,v,[inFx,outFx]]=S[i];
  const t=getSceneDuration();

  // 首屏隐藏左上角微标，后续页面淡入显示
  brandCorner.style.opacity = (i === 0) ? '0' : '1';

  const e=document.createElement('div');
  e.className=`scene ${inFx}`;
  e.dataset.outFx=outFx;
  e.innerHTML=`
    <div class="hd">
      <div class="k">${k}</div>
      <h2 class="h">${h}</h2>
    </div>
    <div class="vis-box">
      <div class="vis">${V[v]}</div>
    </div>
    <div class="ft">
      <p class="p">${p}</p>
    </div>
  `;
  sc.appendChild(e);

  bar.style.transition='none';
  bar.style.width=(i/N*100)+'%';
  void bar.offsetWidth;
  bar.style.transition=`width ${t}ms linear`;
  bar.style.width=((i+1)/N*100)+'%';

  tm=setTimeout(()=>go(i+1),t);
}

// 严格串行转场调度（旧页 450ms 完全消失后，新页才出现）
function go(i){
  if(isSwitching) return;
  clearTimeout(tm);

  if(i>=N){
    bgm.pause();
    bgm.currentTime=0;
    ov.style.display='flex';
    ov.querySelector('i:last-child').textContent='↻ 点击重新启幕';
    return;
  }
  if(i<0) i=0;

  const old=sc.firstElementChild;
  if(old){
    isSwitching=true;
    bar.style.transition='none';
    
    const outFx=old.dataset.outFx||'fx-zoom-out';
    old.className=`scene ${outFx}`;

    setTimeout(()=>{
      old.remove();
      isSwitching=false;
      renderScene(i);
    }, SWITCH_DELAY);
  } else {
    renderScene(i);
  }
}

function play(){
  ov.style.display='none';
  bgm.currentTime=0; // 仅重播时从头启动
  bgm.volume=0.75;
  bgm.play().catch(e=>console.log('Audio autoplay prevented:',e));
  sc.innerHTML='';
  go(0);
}

ov.onclick=play;
addEventListener('keydown',e=>{
  if(ov.style.display==='none' && !isSwitching){
    if(e.key==='ArrowRight'||e.key===' ') go(cur+1);
    if(e.key==='ArrowLeft') go(cur-1);
  }
});

// 背景微光粒子
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),st=document.getElementById('st');
let P=[],w,h;
function rs(){
  w=cv.width=st.clientWidth;h=cv.height=st.clientHeight;
  P=Array.from({length:45},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.4,v:Math.random()*.2+.05}));
}
rs();
addEventListener('resize',rs);
(function f(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='rgba(249,247,242,.2)';
  P.forEach(p=>{
    p.y-=p.v;if(p.y<0)p.y=h;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  });
  requestAnimationFrame(f);
})();
</script>
